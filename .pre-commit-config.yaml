# Install once:  pip install pre-commit && pre-commit install
# The eslint/prettier hooks need web dependencies installed locally (cd apps/web && npm ci).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^apps/api/
        pass_filenames: false
        entry: bash -c 'cd apps/api && mypy'
        additional_dependencies:
          - fastapi>=0.115
          - pydantic>=2.9
          - pydantic-settings>=2.6
          - sqlalchemy[asyncio]>=2.0.36
          - alembic>=1.14
          - redis>=6.1
          - celery-types>=0.22
          - httpx>=0.27
          - pytest>=8.3

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: system
        entry: bash -c 'cd apps/web && npx next lint --fix'
        files: ^apps/web/.*\.(ts|tsx|js|mjs)$
        pass_filenames: false
      - id: prettier
        name: prettier
        language: system
        entry: apps/web/node_modules/.bin/prettier --write --ignore-unknown
        files: ^apps/web/
