[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hr-portal-api"
version = "0.1.0"
description = "HR Recruitment Portal (ATS) API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "celery[redis]>=5.5,<6.0",
  "redis>=6.1,<8.0",
  "argon2-cffi>=23.1,<26.0",
  "pyjwt>=2.10,<3.0",
  "email-validator>=2.2,<3.0",
  "python-multipart>=0.0.18,<1.0",
  "boto3>=1.35.0,<1.36",
  "pdfplumber>=0.11,<1.0",
  "pymupdf>=1.24.14,<1.25",
  "python-docx>=1.1,<2.0",
  "pytesseract>=0.3,<1.0",
  "Pillow>=10.0,<12.0",
  "spacy>=3.7,<4.0",
  "scikit-learn>=1.5,<2.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
  "celery-types>=0.22",
  "types-Pillow>=10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "C4", "SIM", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"app/cv_engine/**" = ["PLC0415", "PLR0913", "PLR0915", "PLW2901", "RUF001", "RUF002", "RUF046", "RUF100", "RUF005", "C420", "E501", "S105"]
"app/services/analysis.py" = ["PLC0415", "PLR0912", "PLR0915", "E501"]
"app/services/cv_processing.py" = ["PLR0912", "SIM105", "E501"]
"app/services/analytics.py" = ["E501"]
"app/services/notifications.py" = ["E501"]
"app/services/notes.py" = ["E501"]
"app/services/search.py" = ["E501"]
"app/services/applications.py" = ["PLC0415", "BLE001"]
"app/routers/candidates.py" = ["PLC0415", "PLR0913", "PLR0917"]
"app/routers/applications.py" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = [
  "kombu.*",
  "boto3.*",
  "botocore.*",
  "pdfplumber.*",
  "fitz.*",
  "docx.*",
  "pytesseract.*",
  "spacy.*",
  "sklearn.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
